<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countdown to Friday 5PM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fleur+De+Leah&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Corner Images -->
    <img src="assets/top-left.jpg" class="corner top-left">
    <img src="assets/top-right.png" class="corner top-right">
    <img src="assets/bottom-left.png" class="corner bottom-left">
    <img src="assets/bottom-right.png" class="corner bottom-right">

    <!-- Edge Lines -->
    <div class="gold-line top"></div>
    <div class="gold-line bottom"></div>
    <div class="gold-line left"></div>
    <div class="gold-line right"></div>

    <!-- Center Content -->
    <div class="center-container">
        <img src="assets/phoenix.png" class="phoenix">
        <div id="countdown"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
